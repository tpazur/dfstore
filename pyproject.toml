[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfstore"
version = "0.1.0"
description = "Centralized DataFrame Storage"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "typer[all]>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = ["flask>=3.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
dfstore = "dfstore.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dfstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
