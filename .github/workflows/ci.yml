name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        pandas-version: ["2.0", "2.2"]
        polars-version: ["0.20", "1.20"]
        exclude:
          # pandas 2.0 wheels were built against numpy 1.x and don't exist for Python 3.12+
          - python-version: "3.12"
            pandas-version: "2.0"
          - python-version: "3.13"
            pandas-version: "2.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          NUMPY_PIN=""
          if [ "${{ matrix.pandas-version }}" = "2.0" ]; then
            NUMPY_PIN="numpy<2.0"
          fi
          pip install -e ".[gui]" pytest pytest-cov ruff \
            "pandas==${{ matrix.pandas-version }}.*" \
            "polars==${{ matrix.polars-version }}.*" \
            ${NUMPY_PIN:+"$NUMPY_PIN"}

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=dfstore --cov-report=term-missing

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/dfstore/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
