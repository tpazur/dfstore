[tox]
env_list =
    py310-pandas{20,21,22,23}-polars{020,100,120}
    py311-pandas{20,21,22,23,30}-polars{020,100,120}
    py312-pandas{21,22,23,30}-polars{020,100,120}
    py313-pandas{22,23,30}-polars{020,100,120}
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=5.0
    pandas20: pandas>=2.0,<2.1
    pandas20: numpy<2.0
    pandas21: pandas>=2.1,<2.2
    pandas21: numpy<2.0
    pandas22: pandas>=2.2,<2.3
    pandas23: pandas>=2.3,<2.4
    pandas30: pandas>=3.0,<3.1
    polars020: polars>=0.20,<0.21
    polars100: polars>=1.0,<1.1
    polars120: polars>=1.20,<1.21
    pyarrow>=14.0
commands =
    pytest {posargs:tests}
package = editable
