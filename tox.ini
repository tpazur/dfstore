[tox]
env_list =
    py{310,311,312,313,314}-pandas{20,22}-polars{020,100,120}
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=5.0
    pandas20: pandas>=2.0,<2.1
    pandas22: pandas>=2.2,<2.3
    polars020: polars>=0.20,<0.21
    polars100: polars>=1.0,<1.1
    polars120: polars>=1.20,<1.21
    pyarrow>=14.0
commands =
    pytest {posargs:tests}
package = editable
